const getBandLevel = (category, score) => {
  const n = Number(score);
  const item = writingRubrics[category].items.find(x => x.scores.includes(n));
  return item ? item.level : null;
};

function calculateFinalDecision(first, second) {
  if (!first || !second) return null;

  const diff = Math.abs(Number(first.score) - Number(second.score));
  const sameContentBand =
    getBandLevel('content', first.content) === getBandLevel('content', second.content);
  const sameLanguageBand =
    getBandLevel('language', first.language) === getBandLevel('language', second.language);

  const useFirst = diff <= 2 && sameContentBand && sameLanguageBand;
  const chosen = useFirst ? first : second;

  let reason = '';
  if (useFirst) {
    reason = '总分差距在2分以内，各分项等级一致 → 采用一改';
  } else if (diff > 2) {
    reason = '总分差距超过2分 → 采用二改';
  } else {
    const reasons = [];
    if (!sameContentBand) reasons.push('内容等级不同');
    if (!sameLanguageBand) reasons.push('表达等级不同');
    reason = reasons.join('、') + ' → 采用二改';
  }

  return {
    stage: useFirst ? '一改' : '二改',
    score: Number(chosen.score),
    content: Number(chosen.content),
    language: Number(chosen.language),
    marker: chosen.marker || '',
    reason: reason
  };
}

function PasswordGate({onUnlock}) {
  const [pw,setPw] = useState('');
  const [error,setError] = useState('');
  const submit = (e) => {
    e.preventDefault();
    if (pw === ACCESS_PASSWORD) {
      onUnlock();
    } else {
      setError('密码不正确，请重试。');
      setPw('');
    }
  };
  return (
    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
      <form onSubmit={submit} className="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
        <div className="text-center mb-7">
          <div className="text-5xl mb-3">🔒</div>
          <h1 className="text-2xl font-black text-slate-900">雅德小学三年级华文写作</h1>
          <p className="text-slate-500 mt-2">请输入密码进入评分系统</p>
        </div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} autoFocus
          className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-lg outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          placeholder="密码" />
        {error && <div className="text-red-600 font-bold text-sm mt-3">{error}</div>}
        <button className="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl shadow">进入系统</button>
      </form>
    </div>
  );
}

    n=Math.max(0,Math.min(writingRubrics[category].max,n));
    setScores(prev=>({...prev,[category]:n}));

          <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4 mb-4">
            <span className="text-2xl font-black bg-gradient-to-r from-blue-700 to-indigo-700 bg-clip-text text-transparent">雅德小学三年级华文写作</span>
            <div className="flex bg-white p-1 rounded-xl border border-slate-200 shadow-sm">
              {['一改','二改'].map(stage=><button key={stage} onClick={()=>setRevisionStage(stage)} className={`px-4 py-1.5 rounded-lg font-bold text-sm ${revisionStage===stage?'bg-blue-600 text-white':'text-slate-500'}`}>{stage==='二改'?'二改 (抽查)':stage}</button>)}
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-3">
            <label className="font-bold text-sm">级任班:
              <select value={selectedFormClass} onChange={handleFormClassChange} className="ml-1 border-2 rounded-xl px-3 py-2 bg-white">
                <option value="">- 选择 -</option>{availableFormClasses.map(x=><option key={x}>{x}</option>)}
              </select>
            </label>
            <label className="font-bold text-sm">母语班:
              <select value={student.mtl} onChange={handleMTClassChange} disabled={!selectedFormClass} className="ml-1 border-2 rounded-xl px-3 py-2 bg-white disabled:bg-slate-100">
                <option value="">- 选择 -</option>{availableMTClasses.map(x=><option key={x}>{x}</option>)}
              </select>
            </label>
            <label className="font-bold text-sm">学生:
              <select value={student.name} onChange={handleStudentSelect} disabled={!student.mtl} className="ml-1 w-56 border-2 rounded-xl px-3 py-2 bg-white text-blue-700 disabled:bg-slate-100">
                <option value="">- 选择 -</option>{filteredStudents.map((s,i)=><option key={i} value={s.name}>{s.name}</option>)}
              </select>
            </label>
            <label className="font-bold text-sm text-purple-700">评卷老师 ({revisionStage}):
              <select value={currentExaminer} onChange={handleExaminerChange} className="ml-1 border-2 border-purple-200 rounded-xl px-3 py-2 bg-purple-50 text-purple-800">
                <option value="">- 选择 -</option>{examinersList.map(x=><option key={x}>{x}</option>)}
              </select>
            </label>
          </div>
        </div>
        <div className="flex items-center gap-5">
          <div className="text-center"><div className="text-xs font-bold text-slate-500">内容</div><div className="font-black text-xl text-indigo-600">{contentTotal}<span className="text-sm text-slate-400">/7</span></div></div>
          <div className="text-center"><div className="text-xs font-bold text-slate-500">表达</div><div className="font-black text-xl text-indigo-600">{languageTotal}<span className="text-sm text-slate-400">/8</span></div></div>
          <div className="text-center px-6 py-2 rounded-2xl bg-blue-600 text-white shadow"><div className="text-xs font-bold">{revisionStage}得分</div><div className="font-black text-3xl">{grandTotal}<span className="text-sm">/15</span></div></div>
        </div>
      </div>
    </div>

    {student.name && (record1 || record2) && <div className="mb-8 no-print bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm">
      <h4 className="font-black text-lg mb-4">📊 已提交的批改记录 ({student.name})</h4>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-center">
        <div className={finalDecision && finalDecision.stage === '一改' ? 'p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-500 ring-4 ring-emerald-100' : 'p-4 rounded-2xl border-2 bg-slate-50 border-slate-200'}>
          <div className="text-xs font-bold text-slate-500">一改 ({record1 ? (record1.marker || '未记录') : '未记录'})</div>
          <div className="text-xl font-black">{record1 ? (record1.content + '+' + record1.language + '=' + record1.score + '分') : '未提交'}</div>
          {finalDecision && finalDecision.stage === '一改' && <div className="mt-2 inline-block px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-black">✓ 最终采用</div>}
        </div>
        <div className={finalDecision && finalDecision.stage === '二改' ? 'p-4 rounded-2xl border-2 bg-emerald-50 border-emerald-500 ring-4 ring-emerald-100' : 'p-4 rounded-2xl border-2 bg-slate-50 border-slate-200'}>
          <div className="text-xs font-bold text-slate-500">二改 ({record2 ? (record2.marker || '未记录') : '未记录'})</div>
          <div className="text-xl font-black">{record2 ? (record2.content + '+' + record2.language + '=' + record2.score + '分') : '未提交'}</div>
          {finalDecision && finalDecision.stage === '二改' && <div className="mt-2 inline-block px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-black">✓ 最终采用</div>}
        </div>
      </div>
      {finalDecision && <div className="mt-5 bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-5">
        <div className="font-black text-emerald-900 text-lg">最终成绩：{finalDecision.score}/15（采用{finalDecision.stage} · {finalDecision.marker}）</div>
        <div className="text-sm font-bold text-emerald-800 mt-1">内容 {finalDecision.content}/7　表达 {finalDecision.language}/8</div>
        <div className="text-sm text-emerald-800 mt-2">{finalDecision.reason}</div>
      </div>}
    </div>}

    <div className="print-only print-container">
      <h1 className="text-3xl font-black text-center mb-6">✍️ 雅德小学三年级华文写作反馈单 ✍️</h1>
      <div className="text-center text-lg mb-8">级任班：<b>{student.class}</b>　母语班：<b>{student.mtl}</b>　学生：<b>{student.name}</b>　评卷老师：<b>{currentExaminer}</b></div>
      <div className="flex justify-center gap-4 mb-8 text-center">
        <div className="p-4 border-2 rounded-2xl w-36"><b>内容</b><div className="text-3xl font-black">{contentTotal}/7</div></div>
        <div className="p-4 border-2 rounded-2xl w-36"><b>表达</b><div className="text-3xl font-black">{languageTotal}/8</div></div>
        <div className="p-4 border-4 border-emerald-200 bg-emerald-50 rounded-2xl w-40"><b>总分</b><div className="text-4xl font-black text-emerald-800">{grandTotal}/15</div></div>
      </div>
      <h2 className="text-xl font-black mb-3">老师评估评语：</h2>
      <div className="border-2 rounded-2xl p-6 text-lg whitespace-pre-wrap min-h-[150px]">{feedbackText}</div>
    </div>

    <div className="no-print">
      <h2 className="text-2xl font-black mb-6 px-4 border-l-8 border-blue-600">第一部分：内容 (7分)</h2>
      {renderRubricRow('content',writingRubrics.content)}
      <h2 className="text-2xl font-black mb-6 px-4 border-l-8 border-indigo-600">第二部分：表达 (8分)</h2>
      {renderRubricRow('language',writingRubrics.language)}

      <div className="mt-12 p-6 md:p-8 rounded-3xl border-2 shadow-sm bg-blue-50/50 border-blue-100">
        <h3 className="font-black text-xl md:text-2xl mb-4">📝 综合评估评语预览</h3>
        <textarea value={feedbackText} onChange={e=>setFeedbackText(e.target.value)} className="w-full h-48 p-6 rounded-2xl border-2 border-blue-200 text-lg leading-relaxed" />
        <div className="flex flex-col md:flex-row justify-between gap-4 mt-7 pt-6 border-t">
          <button onClick={()=>setDialog({isOpen:true,title:'确认清空',message:'确定要清空当前分数，准备给下一位学生打分吗？',type:'confirm',onConfirm:clearScores})} className="px-6 py-3 rounded-xl bg-white border-2 font-bold">🔄 清空重置</button>
          <div className="flex gap-3">
            <button onClick={handlePrint} className="px-6 py-3 rounded-xl bg-white border-2 font-bold">🖨️ 打印/保存 PDF</button>
            <button onClick={()=>handleSubmitGAS(false)} disabled={submitStatus==='loading'} className="px-8 py-3 rounded-xl bg-indigo-600 text-white font-black shadow">{submitStatus==='loading'?'☁️ 提交中...':'☁️ 提交云端表格'}</button>
          </div>
        </div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
